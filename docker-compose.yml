services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: dashboard-sqlserver
    user: "0:0"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "DWHouse@Competencia2026"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql/data
      - sqlserver-log:/var/opt/mssql/log
      - ./data:/var/opt/mssql/backup:ro
    restart: unless-stopped

volumes:
  sqlserver-data:
  sqlserver-log:
